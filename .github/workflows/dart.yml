name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Publish dry-run
        run: flutter pub publish --dry-run

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example (web)
        working-directory: example
        run: flutter build web --no-pub

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      # Static analysis only — app/ is a macOS-only product (native Vision
      # framework + CoreGraphics FFI), so `flutter build macos` needs a
      # macos-latest runner and isn't run in this ubuntu-latest job.
      - name: Analyze app
        working-directory: app
        run: flutter analyze
